name: Update profile art

# Refresh contribution data and regenerate the SVG automatically.
# Runs daily, on manual dispatch, and when relevant source files change.

"on":
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate contribution graph
        run: python scripts/generate_streak_svg.py moanishkoya contrib-heatmap.svg

      - name: Commit updated contribution graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"